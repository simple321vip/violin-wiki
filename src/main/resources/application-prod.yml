# ============================================================
# violin-wiki prod profile — production environment
# ============================================================

server:
  port: 8081
  servlet:
    context-path: /wiki

spring:
  application:
    name: violin-wiki-prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:violin}?currentSchema=wiki
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: wiki
    default-schema: wiki
    baseline-on-migrate: true
    locations: classpath:db/migration-wiki
  messages:
    basename: classpath:messages-common
    encoding: UTF-8
    cache-duration: 1h

# ============== violin framework ==============
violin:
  jwt:
    profile: prod
    issuer: ${VIOLIN_JWT_ISSUER:violin-iam}
    audience: ${VIOLIN_JWT_AUDIENCE:violin-services}
    jwks-url: ${VIOLIN_JWT_JWKS_URL:https://iam.violin-work.online/violin-iam/.well-known/jwks.json}
  snowflake:
    worker-id: ${VIOLIN_SNOWFLAKE_WORKER_ID:22}
  iam:
    url: ${VIOLIN_IAM_URL:https://iam.violin-work.online}
    context-path: ${VIOLIN_IAM_CONTEXT_PATH:/violin-iam}
    service-id: ${VIOLIN_IAM_SERVICE_ID:violin-wiki}
    service-token-secret: ${VIOLIN_IAM_SERVICE_TOKEN_SECRET:}
  wiki:
    permission:
      enabled: ${VIOLIN_WIKI_PERMISSION_ENABLED:true}

logging:
  level:
    cn.violin: INFO
