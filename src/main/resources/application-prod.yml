# ============================================================
# violin-wiki prod profile — 生产环境
# ============================================================

server:
  port: 8081
  servlet:
    context-path: /wiki

spring:
  application:
    name: violin-wiki-prod
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:violin}?currentSchema=wiki
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    schemas: wiki
    default-schema: wiki
    baseline-on-migrate: true
    locations: classpath:db/migration-wiki
  messages:
    basename: classpath:messages-common,classpath:messages
    encoding: UTF-8
    cache-duration: 1h

violin:
  jwt:
    secret: ${VIOLIN_JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: "https://*.violin-work.online"
  snowflake:
    worker-id: ${VIOLIN_SNOWFLAKE_WORKER_ID:22}
  auth:
    exclude-paths: "/api/v1/wiki-categories/**"
  storage:
    docsify-volume: /data/docsify
    nginx-static-volume: /data/nginx

logging:
  level:
    cn.violin: INFO