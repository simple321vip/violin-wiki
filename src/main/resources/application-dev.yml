# ============================================================
# violin-wiki dev profile — shared development environment
# ============================================================

server:
  port: 8081
  servlet:
    context-path: /wiki

spring:
  application:
    name: violin-wiki-dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:192.168.3.49}:${DB_PORT:5432}/${DB_NAME:violin_dev}?currentSchema=wiki_dev
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    schemas: wiki_dev
    default-schema: wiki_dev
    baseline-on-migrate: true
    locations: classpath:db/migration-wiki
  messages:
    basename: classpath:messages-common
    encoding: UTF-8
    cache-duration: 1h

# ============== violin framework ==============
violin:
  jwt:
    profile: dev
    issuer: ${VIOLIN_JWT_ISSUER:violin-iam}
    audience: ${VIOLIN_JWT_AUDIENCE:violin-services}
    jwks-url: ${VIOLIN_JWT_JWKS_URL:http://violin-iam.violin-home.cn/violin-iam/.well-known/jwks.json}
  snowflake:
    worker-id: ${VIOLIN_SNOWFLAKE_WORKER_ID:12}
  iam:
    url: ${VIOLIN_IAM_URL:http://violin-iam.violin-home.cn}
    context-path: ${VIOLIN_IAM_CONTEXT_PATH:/violin-iam}
    service-id: ${VIOLIN_IAM_SERVICE_ID:violin-wiki}
    service-token-secret: ${VIOLIN_IAM_SERVICE_TOKEN_SECRET:dev_default_wiki_iam_service_token_secret_hex_64_chars_aaaa}
  wiki:
    permission:
      enabled: ${VIOLIN_WIKI_PERMISSION_ENABLED:false}

logging:
  level:
    cn.violin: INFO
    cn.violin.wiki: DEBUG
