# ============================================================
# violin-wiki local profile — standalone debug environment
# ============================================================
# Differs from dev:
#   - Points to the dev workstation Postgres (192.168.3.49/violin_local)
#     using a dedicated schema (wiki_local) to avoid collisions.
#   - Reuses the dev Authentik issuer/client.
#   - Snowflake worker-id 110 (avoids auth=100, bookmark=101 ranges).
#   - Enables MyBatis Plus SQL trace.
#
# How to start (PowerShell):
#   $env:DB_PASSWORD = "postgres"
#   $env:VIOLIN_JWT_JWKS_URL = "http://localhost:8080/violin-iam/.well-known/jwks.json"
#   mvn -f E:\Project\violin-wiki spring-boot:run "-Dspring-boot.run.profiles=local"

server:
  port: 8081
  servlet:
    context-path: /wiki

spring:
  application:
    name: violin-wiki-local
  datasource:
    url: jdbc:postgresql://192.168.3.49:${DB_PORT:5432}/${DB_NAME:violin_local}?currentSchema=wiki_local
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    schemas: wiki_local
    default-schema: wiki_local
    baseline-on-migrate: true
    locations: classpath:db/migration-wiki
  messages:
    basename: classpath:messages-common
    encoding: UTF-8
    cache-duration: 1h

# ============== violin framework ==============
violin:
  jwt:
    profile: local
    issuer: ${VIOLIN_JWT_ISSUER:violin-iam}
    audience: ${VIOLIN_JWT_AUDIENCE:violin-services}
    jwks-url: ${VIOLIN_JWT_JWKS_URL:http://localhost:8080/violin-iam/.well-known/jwks.json}
  snowflake:
    worker-id: ${VIOLIN_SNOWFLAKE_WORKER_ID:110}
  iam:
    url: ${VIOLIN_IAM_URL:http://localhost:8080}
    context-path: ${VIOLIN_IAM_CONTEXT_PATH:/violin-iam}
    service-id: ${VIOLIN_IAM_SERVICE_ID:violin-wiki}
    service-token-secret: ${VIOLIN_IAM_SERVICE_TOKEN_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  wiki:
    permission:
      enabled: ${VIOLIN_WIKI_PERMISSION_ENABLED:false}

logging:
  level:
    cn.violin: DEBUG
    cn.violin.wiki: TRACE
    com.baomidou.mybatisplus: DEBUG
