# ============================================================
# violin-wiki local profile — 本机独立调试环境
# ============================================================
# 与 dev 的区别：
#   - 数据库连的是 dev 的本地 PG（192.168.3.49/violin-dev），但用独立 schema 隔离
#   - Authentik 用 dev 的 issuer / client，复用同一套 OIDC 应用
#   - 雪花 worker-id 固定 110（避开 auth / bookmark / 其他 dev 同事）
#   - 开启 SQL 日志，便于调试
#
# 启动方式（PowerShell）：
#   $env:DB_PASSWORD = "postgres"
#   $env:VIOLIN_JWT_SECRET = "violin-local-secret-key-32bytes-aaaaaa!"
#   mvn -f E:\Project\violin-wiki spring-boot:run "-Dspring-boot.run.profiles=local"
# ============================================================

server:
  port: 8081
  servlet:
    context-path: /wiki

spring:
  application:
    name: violin-wiki-local
  datasource:
    # core 表建到 public（由 auth 服务的 V1-V99 迁移负责），wiki 表建到 wiki_local
    url: jdbc:postgresql://192.168.3.49:${DB_PORT:5432}/${DB_NAME:violin_local}?currentSchema=wiki_local
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    schemas: wiki_local
    default-schema: wiki_local
    baseline-on-migrate: true
    locations: classpath:db/migration-wiki
  messages:
    basename: classpath:messages-common,classpath:messages
    encoding: UTF-8
    cache-duration: 1h

# ============== violin 框架配置 ==============
violin:
  jwt:
    secret: ${VIOLIN_JWT_SECRET:violin-local-secret-key-32bytes-aaaaaa!}
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173"
  snowflake:
    # 避开 auth (100) / bookmark (101) 等其他服务
    worker-id: ${VIOLIN_SNOWFLAKE_WORKER_ID:110}
  auth:
    exclude-paths: "/api/v1/wiki-categories/**"
  storage:
    docsify-volume: ${VIOLIN_DOCSIFY_VOLUME:E:/}
    nginx-static-volume: ${VIOLIN_NGINX_VOLUME:E:/app/data}

# ============== 日志 ==============
logging:
  level:
    cn.violin: DEBUG
    cn.violin.wiki: TRACE
    org.springframework.security: DEBUG
    com.baomidou.mybatisplus: DEBUG