  name: violin-wiki-secret
  namespace: violin-dev
  labels:
    app.kubernetes.io/name: violin-wiki
    environment: dev
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_DEV_POSTGRES_PASSWORD"
